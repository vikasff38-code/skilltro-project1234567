server.port=${SERVER_PORT:8080}

# A local, file-backed database persists data between backend restarts.
spring.datasource.url=${H2_DATABASE_URL:jdbc:h2:file:./data/skilltro;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${H2_DATABASE_USERNAME:sa}
spring.datasource.password=${H2_DATABASE_PASSWORD:}

# Flyway owns schema creation and upgrades; Hibernate validates the mapped model.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

skilltro.cors.allowed-origins=${SKILLTRO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
# The H2 console is disabled unless the local profile is explicitly enabled.
spring.h2.console.enabled=false
